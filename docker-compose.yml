services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hirynex-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Ensure database file is placed in the persistent volume directory
      - DATABASE_URL=sqlite:////app/data/frontline.db
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:3000}
    volumes:
      - hirynex_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - hirynex-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: hirynex-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - hirynex-network

volumes:
  hirynex_data:
    name: hirynex_data

networks:
  hirynex-network:
    driver: bridge
